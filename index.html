<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebuk Bot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      color: #172033;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 30px 20px;
      background: #1877f2;
      color: white;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0 0 6px;
    }

    main {
      padding: 20px;
    }

    .card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Facebuk Bot</h1>
    <p>Your Telegram Web App</p>
  </header>

  <main>

    <div class="card">
      <h2>Welcome 👋</h2>

      <p>
        Welcome to Facebuk Bot.
        This is your first Telegram Web App.
      </p>

      <button onclick="alert('Your Web App is working!')">
        Open App
      </button>
<button onclick="openFacebook()"
style="display:block; width:100%; box-sizing:border-box;">
Open Facebook
</button>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
function openFacebook() {
    if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.openLink("https://www.facebook.com/");
    } else {
        window.open("https://www.facebook.com/", "_blank");
    }
}
</script>

<script>
function openFacebook() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
        window.location.href =
        "intent://www.facebook.com/#Intent;scheme=https;package=com.facebook.katana;end";
    }
    else if (/iPhone|iPad|iPod/i.test(ua)) {
        window.location.href =
        "fb://facewebmodal/f?href=https://www.facebook.com/";
    }
    else {
        window.location.href = "https://www.facebook.com/";
    }
}
</script>
</div>
  </main>

</div>

</body>
  </html>
