<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebuk Bot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      color: #172033;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 30px 20px;
      background: #1877f2;
      color: white;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0 0 6px;
    }

    main {
      padding: 20px;
    }

    .card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Facebuk Bot</h1>
    <p>Your Telegram Web App</p>
  </header>

  <main>

    <div class="card">
      <h2>Welcome 👋</h2>

      <p>
        Welcome to Facebuk Bot.
        This is your first Telegram Web App.
      </p>

      <button onclick="alert('Your Web App is working!')">
        Open App
      </button>
      <button
  type="button"
  onclick="openFacebook()"
  style="width:100%; padding:15px; border:0; border-radius:12px; background:#1877F2; color:white; font-size:16px; font-weight:bold;"
>
  Open Facebook
</button>

<script>
function openFacebook() {
  Telegram.WebApp.openLink("https://www.facebook.com/");
}
</script>
    </div>

  </main>

</div>

</body>
  </html>
